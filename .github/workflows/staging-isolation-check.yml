name: Staging isolation check (read-only)

# Manual, read-only. The staging payroll e2e marked-paid OK but found no ledger row in
# staging — likely because USE_TPHR_PAYROLL/USE_TPERP_API (copied from prod into staging)
# kept HrService/ErpService in API mode, hitting PROD services instead of the staging DB.
# This checks those flags in both DBs and scans for any stray payroll test rows the e2e
# may have left in PROD (it self-cleans via cancelPaid, so prod should be clean).
on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check SSH config
        id: cfg
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
        run: '[ -n "$SSH_HOST" ] && echo "ready=yes" >> "$GITHUB_OUTPUT" || echo "ready=no" >> "$GITHUB_OUTPUT"'
      - name: Inspect on server
        if: steps.cfg.outputs.ready == 'yes'
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          script: |
            q() { plesk db "$1" 2>&1; }
            echo "=== API-mode flags in system_settings (prod vs staging) ==="
            q "SELECT 'prod' db, setting_key, setting_value FROM tp_crm.system_settings WHERE setting_key IN ('USE_TPHR_PAYROLL','USE_TPERP_API') UNION ALL SELECT 'staging', setting_key, setting_value FROM tp_crm_staging.system_settings WHERE setting_key IN ('USE_TPHR_PAYROLL','USE_TPERP_API')"
            echo "=== stray payroll test rows in PROD erp_company_transactions? (expect 0 — e2e self-cleans) ==="
            q "SELECT COUNT(*) AS prod_payroll_tx_recent FROM tp_crm.erp_company_transactions WHERE reference_type='payroll' AND created_at >= NOW() - INTERVAL 1 HOUR"
            echo "=== recent payroll_runs in PROD (expect none seeded by e2e) ==="
            q "SELECT COUNT(*) AS prod_recent_runs FROM tp_crm.payroll_runs WHERE created_at >= NOW() - INTERVAL 1 HOUR"
            echo "=== staging erp_company_transactions payroll rows ==="
            q "SELECT COUNT(*) AS staging_payroll_tx FROM tp_crm_staging.erp_company_transactions WHERE reference_type='payroll'"
