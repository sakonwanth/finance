name: Deploy retired tp-finance shell

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  validate:
    name: QA, Audit, E2E
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
      - name: QA syntax
        run: find . -name "*.php" -print0 | xargs -0 -n1 php -l
      - name: Audit retirement contract
        run: php scripts/audit_retirement_contract.php
      - name: E2E canonical redirects
        run: php scripts/qa_e2e_retirement_redirects.php

  deploy:
    name: Auto Deploy and Verify
    needs: [validate]
    runs-on: ubuntu-latest
    steps:
      - name: Check deploy config
        id: cfg
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
        run: |
          if [ -n "$SSH_HOST" ]; then
            echo "ready=yes" >> "$GITHUB_OUTPUT"
          else
            echo "ready=no" >> "$GITHUB_OUTPUT"
            echo "::error::SSH deploy configuration is required for the retired finance shell"
            exit 1
          fi
      - name: Deploy and production verify
        if: steps.cfg.outputs.ready == 'yes'
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          script: |
            set -e
            cd "${{ secrets.SSH_PATH }}" || { echo "SSH_PATH missing"; exit 1; }
            git fetch origin main
            git clean -fd
            git reset --hard origin/main
            PHP_BIN=$(which php 2>/dev/null || echo php)
            $PHP_BIN scripts/audit_retirement_contract.php
            $PHP_BIN scripts/qa_e2e_retirement_redirects.php
            LOCATION=$(curl -sS -o /dev/null -D - --max-time 15 'https://finance.tp-asset.com/?page=calculator' | tr -d '\r' | awk 'BEGIN{IGNORECASE=1} /^location:/{print $2}')
            test "$LOCATION" = "https://erp.tp-asset.com/operations/deal-calculator"
            echo "tp-finance retirement shell verified: $(git log -1 --format='%h %s')"
