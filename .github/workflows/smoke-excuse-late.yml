name: Smoke HR excuse-late endpoint (non-destructive)

# Manual. Probes POST /attendance/excuse-late on tp-hr with attendance_id=0 using checkin's
# write_all key: the endpoint checks scope then rejects attendance_id<=0 with 400 BEFORE any
# UPDATE. 400 proves route + auth + scope + param parsing without writing. 401/403/404 = bad.
on:
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Check SSH config
        id: cfg
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
        run: '[ -n "$SSH_HOST" ] && echo "ready=yes" >> "$GITHUB_OUTPUT" || echo "ready=no" >> "$GITHUB_OUTPUT"'
      - name: Probe on server
        if: steps.cfg.outputs.ready == 'yes'
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          script: |
            set -e
            CH=/var/www/vhosts/tp-asset.com/checkin.tp-asset.com
            KEY=$(grep -E '^TP_HR_API_KEY=' "$CH/.env" | head -1 | cut -d= -f2-)
            URL=$(grep -E '^TP_HR_API_URL=' "$CH/.env" | head -1 | cut -d= -f2-)
            URL=${URL:-https://hr.tp-asset.com/api/v1}
            [ -n "$KEY" ] || { echo "no HR key"; exit 1; }
            echo "POST $URL/attendance/excuse-late (attendance_id=0, non-destructive)"
            body=$(curl -s -m 20 -w '\nHTTP:%{http_code}' -X POST \
              -H "Authorization: Bearer $KEY" -H "Content-Type: application/json" \
              -d '{"attendance_id":0,"excused":1}' "$URL/attendance/excuse-late" || true)
            code=$(printf '%s' "$body" | sed -n 's/.*HTTP:\([0-9]*\)$/\1/p')
            echo "HTTP $code"
            echo "resp: $(printf '%s' "$body" | sed 's/HTTP:[0-9]*$//' | tr -d '\n')"
            case "$code" in
              400) echo "ROUTE+AUTH OK ✓ — rejected attendance_id=0 pre-write";;
              401|403) echo "AUTH/SCOPE problem ✗ (needs attendance.write_all)"; exit 1;;
              404) echo "ROUTE not found ✗ (endpoint not deployed?)"; exit 1;;
              *) echo "UNEXPECTED $code ✗"; exit 1;;
            esac
