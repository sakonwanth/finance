name: Sync one tp-erp file from origin/main

# Manual. Deploy-by-proxy for a SINGLE tp-erp file while tp-erp's own Actions are
# billing-blocked: checks out origin/main's version of <path> into the server's erp
# working tree. The content is exactly what's committed+reviewed on origin/main, so the
# next successful tp-erp deploy (git reset --hard origin/main) realigns with no drift.
# Use for code hotfixes only (no secrets/.env). Lives in tp-finance (public → Actions run).
on:
  workflow_dispatch:
    inputs:
      path:
        description: 'Repo-relative tp-erp file path to sync from origin/main'
        required: true
        default: 'api/v1/endpoints/dashboard/financial.php'

jobs:
  sync:
    name: Sync file on prod
    runs-on: ubuntu-latest
    steps:
      - name: Check SSH config
        id: cfg
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
        run: '[ -n "$SSH_HOST" ] && echo "ready=yes" >> "$GITHUB_OUTPUT" || echo "ready=no" >> "$GITHUB_OUTPUT"'
      - name: Sync on server
        if: steps.cfg.outputs.ready == 'yes'
        uses: appleboy/ssh-action@v1.0.3
        env:
          FILEPATH: ${{ inputs.path }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          envs: FILEPATH
          script: |
            set -e
            case "$FILEPATH" in *..*|/*) echo "invalid path"; exit 2;; esac
            case "$FILEPATH" in *.php) ;; *) echo "only .php files"; exit 2;; esac
            case "$FILEPATH" in *.env*) echo "refusing env file"; exit 2;; esac
            FIN="${{ secrets.SSH_PATH }}"
            ERP_DIR=""
            for cand in \
              "$FIN/../tp-erp" "$FIN/../erp" "$FIN/../../tp-erp" \
              "$(printf '%s' "$FIN" | sed 's#finance#erp#g')"; do
              if [ -n "$cand" ] && [ -f "$cand/bootstrap.php" ] && [ -d "$cand/scripts" ]; then ERP_DIR=$(realpath "$cand"); break; fi
            done
            if [ -z "$ERP_DIR" ]; then
              ERP_DIR=$(dirname "$(dirname "$(find /var/www /var/www/vhosts /home /srv -maxdepth 6 -name issue_erp_api_key.php -path '*erp*' 2>/dev/null | head -1)")")
            fi
            [ -d "$ERP_DIR" ] || { echo "tp-erp checkout not found"; exit 1; }
            echo "Using tp-erp at: $ERP_DIR (file: $FILEPATH)"
            cd "$ERP_DIR"
            git fetch origin main --quiet 2>&1 || echo "git fetch failed"
            git show "origin/main:$FILEPATH" > /dev/null 2>&1 || { echo "file not in origin/main"; exit 1; }
            BEFORE=$(git rev-parse --short origin/main)
            git checkout origin/main -- "$FILEPATH"
            $(which php 2>/dev/null || echo php) -l "$FILEPATH"
            echo "Synced $FILEPATH to origin/main@$BEFORE"
