name: Diagnose tp-erp financial 500

# Manual-only, read-only. Runs tp-erp's diagnose_financial_dashboard.php on the server
# to pinpoint why GET /api/v1/dashboard/financial returns 500. Pulls the script from
# tp-erp's origin/main (tp-erp's own deploy is billing-blocked) into a temp file, runs
# it against the erp checkout's DB, then removes it. Prints query OK/FAIL labels + PDO
# messages only — no financial values. Lives in tp-finance because this repo is public
# so its Actions run; it SSHes to the same server where tp-erp is checked out.
on:
  workflow_dispatch:

jobs:
  diagnose:
    name: Run financial diagnostic on server
    runs-on: ubuntu-latest
    steps:
      - name: Check SSH config
        id: cfg
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
        run: '[ -n "$SSH_HOST" ] && echo "ready=yes" >> "$GITHUB_OUTPUT" || echo "ready=no" >> "$GITHUB_OUTPUT"'
      - name: Diagnose on server
        if: steps.cfg.outputs.ready == 'yes'
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          script: |
            set -e
            FIN="${{ secrets.SSH_PATH }}"
            PHP_BIN=$(which php 2>/dev/null || echo php)
            # Locate tp-erp checkout (same logic as setup-erp-api-key).
            ERP_DIR=""
            for cand in \
              "$FIN/../tp-erp" "$FIN/../erp" "$FIN/../../tp-erp" \
              "$(printf '%s' "$FIN" | sed 's#finance#erp#g')"; do
              if [ -n "$cand" ] && [ -f "$cand/bootstrap.php" ] && [ -d "$cand/scripts" ]; then ERP_DIR=$(realpath "$cand"); break; fi
            done
            if [ -z "$ERP_DIR" ]; then
              ERP_DIR=$(dirname "$(dirname "$(find /var/www /var/www/vhosts /home /srv -maxdepth 6 -name issue_erp_api_key.php -path '*erp*' 2>/dev/null | head -1)")")
            fi
            [ -d "$ERP_DIR/scripts" ] || { echo "tp-erp checkout not found"; exit 1; }
            echo "Using tp-erp at: $ERP_DIR"
            cd "$ERP_DIR"
            git fetch origin main --quiet 2>&1 || echo "git fetch failed — using deployed copy if present"
            TMP="scripts/_diag_financial_$$.php"
            if git show origin/main:scripts/diagnose_financial_dashboard.php > "$TMP" 2>/dev/null && [ -s "$TMP" ]; then
              echo "(diagnostic pulled from origin/main)"
            elif [ -f scripts/diagnose_financial_dashboard.php ]; then
              cp scripts/diagnose_financial_dashboard.php "$TMP"; echo "(diagnostic from deployed copy)"
            else
              echo "diagnostic script unavailable"; rm -f "$TMP"; exit 1
            fi
            echo "================================================"
            $PHP_BIN "$TMP" 2>&1 || true
            echo "================================================"
            rm -f "$TMP"
