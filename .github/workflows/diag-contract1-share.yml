name: Diag contract1 sharing (read-only)

on:
  workflow_dispatch:

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: Check SSH config
        id: cfg
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
        run: '[ -n "$SSH_HOST" ] && echo "ready=yes" >> "$GITHUB_OUTPUT" || echo "ready=no" >> "$GITHUB_OUTPUT"'
      - name: Diag
        if: steps.cfg.outputs.ready == 'yes'
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          script: |
            echo "=== how many DISTINCT customers' debt_closure_cases use contract #1 (shared?) ==="
            plesk db "SELECT contract_id, COUNT(*) AS cases, COUNT(DISTINCT customer_id) AS customers FROM tp_crm.erp_debt_closure_cases WHERE contract_id=1 GROUP BY contract_id" 2>&1
            echo "=== do the seed-verify customers (CTP20260010/082/100) use contract #1? ==="
            plesk db "SELECT c.customer_code, dcc.contract_id, COUNT(*) cases
                      FROM tp_crm.customers c JOIN tp_crm.erp_debt_closure_cases dcc ON dcc.customer_id=c.id
                      WHERE c.customer_code IN ('CTP20260010','CTP20260082','CTP20260100')
                      GROUP BY c.customer_code, dcc.contract_id" 2>&1
            echo "=== renovation #25 expenses columns (find real description/source) ==="
            plesk db "SHOW COLUMNS FROM tp_crm.erp_renovation_expenses" 2>&1 | head -25
            plesk db "SELECT * FROM tp_crm.erp_renovation_expenses WHERE renovation_project_id=25\G" 2>&1 | head -40
