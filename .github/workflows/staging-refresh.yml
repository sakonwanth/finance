name: Refresh tp_crm_staging from prod

# Manual. Refreshes the existing (stale) tp_crm_staging with a current copy of prod tp_crm.
# PROD IS READ-ONLY: mysqldump --single-transaction (consistent, non-locking for InnoDB).
# Only tp_crm_staging is written. Does NOT drop the database (keeps Plesk registration +
# the tpasset_db grant) — the dump's DROP TABLE/CREATE replaces tables in place. DEFINER
# clauses are stripped so views/triggers import cleanly under the admin user.
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "refresh" to confirm overwriting tp_crm_staging'
        required: true
        default: ''

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Check inputs + SSH
        id: cfg
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
        run: |
          [ "${{ inputs.confirm }}" = "refresh" ] || { echo "confirm != refresh — aborting"; exit 1; }
          [ -n "$SSH_HOST" ] && echo "ready=yes" >> "$GITHUB_OUTPUT" || { echo "no SSH"; exit 1; }
      - name: Refresh on server
        if: steps.cfg.outputs.ready == 'yes'
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          command_timeout: 30m
          script: |
            set -e
            SRC=tp_crm
            DST=tp_crm_staging
            [ -r /etc/psa/.psa.shadow ] || { echo "cannot read Plesk admin secret (need root)"; exit 1; }
            ADM=$(cat /etc/psa/.psa.shadow)
            MYSQL="mysql -uadmin -p$ADM"
            DUMP="mysqldump -uadmin -p$ADM"

            echo "Guard: refuse if $DST looks like a production copy (newer than prod-7d would be odd; here just ensure it is NOT $SRC)"
            [ "$SRC" != "$DST" ] || { echo "src==dst, abort"; exit 1; }

            echo "1/4 dumping prod $SRC (read-only, --single-transaction)…"
            $DUMP --single-transaction --quick --no-tablespaces --routines --triggers --events "$SRC" \
              | sed -E 's/DEFINER=`[^`]*`@`[^`]*`/DEFINER=CURRENT_USER/g' > /tmp/${SRC}_snapshot.sql
            echo "   dump size: $(du -h /tmp/${SRC}_snapshot.sql | cut -f1)"

            echo "2/4 importing into $DST (overwrites staging tables in place)…"
            $MYSQL "$DST" < /tmp/${SRC}_snapshot.sql

            echo "3/4 verify staging now matches prod…"
            $MYSQL -N -e "SELECT CONCAT('staging tables=', COUNT(*)) FROM information_schema.tables WHERE table_schema='$DST'"
            $MYSQL -N -e "SELECT CONCAT('prod tables=', COUNT(*)) FROM information_schema.tables WHERE table_schema='$SRC'"
            $MYSQL -N -e "SELECT CONCAT('staging newest attendance=', IFNULL(MAX(attendance_date),'none')) FROM $DST.hr_attendances"
            $MYSQL -N -e "SELECT CONCAT('prod newest attendance=', IFNULL(MAX(attendance_date),'none')) FROM $SRC.hr_attendances"

            echo "4/4 cleanup dump file"
            rm -f /tmp/${SRC}_snapshot.sql
            echo "DONE — tp_crm_staging refreshed from prod."
