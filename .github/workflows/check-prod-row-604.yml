name: Check prod hr_attendances 604 (read-only)

# Manual, read-only. The excuse-late staging test ran with HrService in API mode; verify the
# API call did NOT modify PROD hr_attendances id=604 (a real prod row) via the prod HR endpoint.
on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check SSH config
        id: cfg
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
        run: '[ -n "$SSH_HOST" ] && echo "ready=yes" >> "$GITHUB_OUTPUT" || echo "ready=no" >> "$GITHUB_OUTPUT"'
      - name: Inspect on server
        if: steps.cfg.outputs.ready == 'yes'
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          script: |
            echo "=== PROD hr_attendances id=604 (look for staging-test audit / recent excuse) ==="
            plesk db "SELECT id, user_id, attendance_date, late_excused, late_excused_reason, late_notified_at, adjustment_reason, updated_at FROM tp_crm.hr_attendances WHERE id=604" 2>&1
            echo "=== any PROD row with the test audit signature? ==="
            plesk db "SELECT id, attendance_date, late_excused, adjustment_reason FROM tp_crm.hr_attendances WHERE adjustment_reason LIKE '%staging-test%' OR late_excused_reason='unit reason'" 2>&1
            echo "=== PROD rows excused/touched in last 30 min ==="
            plesk db "SELECT COUNT(*) AS recent_excused FROM tp_crm.hr_attendances WHERE late_notified_at >= NOW() - INTERVAL 30 MINUTE" 2>&1
