name: Isolate staging (disable API modes)

# Manual. Sets USE_TPHR_PAYROLL=0 + USE_TPERP_API=0 in tp_crm_staging.system_settings ONLY,
# so tp-crm running against staging uses direct DB (staging hr_*/erp_*) instead of calling
# the PROD HR/ERP APIs. Prevents staging tests from leaking into prod. PROD untouched.
on:
  workflow_dispatch:

jobs:
  isolate:
    runs-on: ubuntu-latest
    steps:
      - name: Check SSH config
        id: cfg
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
        run: '[ -n "$SSH_HOST" ] && echo "ready=yes" >> "$GITHUB_OUTPUT" || echo "ready=no" >> "$GITHUB_OUTPUT"'
      - name: Isolate on server
        if: steps.cfg.outputs.ready == 'yes'
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          script: |
            echo "=== before (staging flags) ==="
            plesk db "SELECT setting_key, setting_value FROM tp_crm_staging.system_settings WHERE setting_key IN ('USE_TPHR_PAYROLL','USE_TPERP_API')" 2>&1
            echo "=== set staging flags to 0 (STAGING ONLY) ==="
            plesk db "UPDATE tp_crm_staging.system_settings SET setting_value='0' WHERE setting_key IN ('USE_TPHR_PAYROLL','USE_TPERP_API')" 2>&1
            echo "=== after (staging flags) ==="
            plesk db "SELECT setting_key, setting_value FROM tp_crm_staging.system_settings WHERE setting_key IN ('USE_TPHR_PAYROLL','USE_TPERP_API')" 2>&1
            echo "=== confirm PROD flags UNCHANGED (still 1) ==="
            plesk db "SELECT setting_key, setting_value FROM tp_crm.system_settings WHERE setting_key IN ('USE_TPHR_PAYROLL','USE_TPERP_API')" 2>&1
