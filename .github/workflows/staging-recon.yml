name: Staging setup recon (read-only)

# Manual, read-only. Checks feasibility of creating a tp_crm_staging DB copy on the server:
# SSH user, Plesk/MySQL admin access, prod DB size, free disk, and that tp_crm_staging
# does not already exist. Makes NO changes.
on:
  workflow_dispatch:

jobs:
  recon:
    runs-on: ubuntu-latest
    steps:
      - name: Check SSH config
        id: cfg
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
        run: '[ -n "$SSH_HOST" ] && echo "ready=yes" >> "$GITHUB_OUTPUT" || echo "ready=no" >> "$GITHUB_OUTPUT"'
      - name: Recon on server
        if: steps.cfg.outputs.ready == 'yes'
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          script: |
            echo "WHOAMI: $(whoami) @ $(hostname)"
            echo "--- Plesk CLI ---"
            if command -v plesk >/dev/null 2>&1; then echo "plesk: $(plesk version 2>/dev/null | head -1 || echo present)"; else echo "plesk: NOT in PATH"; fi
            echo "--- MySQL admin access test ---"
            if command -v plesk >/dev/null 2>&1 && plesk db "SELECT 1 AS ok" >/dev/null 2>&1; then
              echo "MySQL admin via 'plesk db': OK"
              echo "--- tp_crm size (MB) + table count ---"
              plesk db "SELECT ROUND(SUM(data_length+index_length)/1024/1024) AS mb, COUNT(*) AS tables FROM information_schema.tables WHERE table_schema='tp_crm'" 2>&1 | head -5
              echo "--- does tp_crm_staging already exist? ---"
              plesk db "SELECT SCHEMA_NAME FROM information_schema.schemata WHERE SCHEMA_NAME='tp_crm_staging'" 2>&1 | head -5
            else
              echo "MySQL admin via 'plesk db': NOT available — will need another path"
            fi
            echo "--- mysqldump present? ---"
            command -v mysqldump >/dev/null 2>&1 && echo "mysqldump: $(mysqldump --version 2>/dev/null | head -1)" || echo "mysqldump: MISSING"
            echo "--- free disk on / and /var ---"
            df -h / /var 2>/dev/null | sed 's/^/  /'
            echo "--- tp-crm .env DB_* (names only, NOT values) ---"
            CRM="/var/www/vhosts/tp-asset.com/crm.tp-asset.com"
            grep -oE '^(DB_HOST|DB_NAME|TP_CRM_DB_NAME|DB_USER|DB_USERNAME)=' "$CRM/.env" 2>/dev/null | sed 's/=$//' | sed 's/^/  set: /' || echo "  (crm .env not at expected path)"
