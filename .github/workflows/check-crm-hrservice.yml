name: Check crm HrService deploy state (read-only)

on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check SSH config
        id: cfg
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
        run: '[ -n "$SSH_HOST" ] && echo "ready=yes" >> "$GITHUB_OUTPUT" || echo "ready=no" >> "$GITHUB_OUTPUT"'
      - name: Inspect
        if: steps.cfg.outputs.ready == 'yes'
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          script: |
            cd /var/www/vhosts/tp-asset.com/crm.tp-asset.com
            git fetch origin main --quiet 2>&1 || true
            echo "HEAD=$(git rev-parse --short HEAD) origin/main=$(git rev-parse --short origin/main)"
            echo "working-tree reclassify methods: $(grep -c 'function reclassifyAttendance' core/Services/HrService.php)"
            echo "origin/main reclassify methods:  $(git show origin/main:core/Services/HrService.php | grep -c 'function reclassifyAttendance')"
            echo "working-tree excuseLate methods: $(grep -c 'function excuseLate' core/Services/HrService.php)"
