name: Apply tp-erp migration (additive)

# Manual. Runs a single additive/idempotent tp-erp migration on the server's shared
# tp_crm DB via apply_one_migration.php (pulled from tp-erp origin/main, since tp-erp's
# own deploy is billing-blocked) and records it in _migrations_run. Use ONLY for additive
# migrations (CREATE TABLE IF NOT EXISTS etc). Lives in tp-finance because this repo is
# public so its Actions run; it SSHes to the same server where tp-erp is checked out.
on:
  workflow_dispatch:
    inputs:
      migration:
        description: 'Migration filename in tp-erp/database/migrations/'
        required: true
        default: '024_erp_bank_transactions.sql'

jobs:
  migrate:
    name: Apply migration on prod
    runs-on: ubuntu-latest
    steps:
      - name: Check SSH config
        id: cfg
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
        run: '[ -n "$SSH_HOST" ] && echo "ready=yes" >> "$GITHUB_OUTPUT" || echo "ready=no" >> "$GITHUB_OUTPUT"'
      - name: Run migration on server
        if: steps.cfg.outputs.ready == 'yes'
        uses: appleboy/ssh-action@v1.0.3
        env:
          MIGRATION: ${{ inputs.migration }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          envs: MIGRATION
          script: |
            set -e
            case "$MIGRATION" in *.sql) ;; *) echo "migration must be a .sql filename"; exit 2;; esac
            case "$MIGRATION" in */*|*..*) echo "invalid migration name"; exit 2;; esac
            FIN="${{ secrets.SSH_PATH }}"
            PHP_BIN=$(which php 2>/dev/null || echo php)
            ERP_DIR=""
            for cand in \
              "$FIN/../tp-erp" "$FIN/../erp" "$FIN/../../tp-erp" \
              "$(printf '%s' "$FIN" | sed 's#finance#erp#g')"; do
              if [ -n "$cand" ] && [ -f "$cand/bootstrap.php" ] && [ -d "$cand/scripts" ]; then ERP_DIR=$(realpath "$cand"); break; fi
            done
            if [ -z "$ERP_DIR" ]; then
              ERP_DIR=$(dirname "$(dirname "$(find /var/www /var/www/vhosts /home /srv -maxdepth 6 -name issue_erp_api_key.php -path '*erp*' 2>/dev/null | head -1)")")
            fi
            [ -d "$ERP_DIR/scripts" ] || { echo "tp-erp checkout not found"; exit 1; }
            echo "Using tp-erp at: $ERP_DIR (migration: $MIGRATION)"
            cd "$ERP_DIR"
            git fetch origin main --quiet 2>&1 || echo "git fetch failed"

            SQL="database/migrations/$MIGRATION"
            APP="scripts/apply_one_migration.php"
            git show "origin/main:$SQL" > "$SQL"
            git show "origin/main:$APP" > "$APP"
            [ -s "$SQL" ] && [ -s "$APP" ] || { echo "failed to fetch migration files from origin/main"; exit 1; }

            echo "================================================"
            $PHP_BIN "$APP" "$MIGRATION"
            STATUS=$?
            echo "================================================"
            exit $STATUS
