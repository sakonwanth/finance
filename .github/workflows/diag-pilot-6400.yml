name: Diagnose pilot +6400 (read-only)

# Manual, read-only. Confirms the pilot's shared active loan contract has renovation
# expenses (from loan testing) that the customer-case bundle pulls via r.contract_id,
# explaining the +6400 pilot cost drift. No writes.
on:
  workflow_dispatch:

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: Check SSH config
        id: cfg
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
        run: '[ -n "$SSH_HOST" ] && echo "ready=yes" >> "$GITHUB_OUTPUT" || echo "ready=no" >> "$GITHUB_OUTPUT"'
      - name: Query prod (read-only)
        if: steps.cfg.outputs.ready == 'yes'
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          script: |
            echo "=== active loan contract the pilot picks (ORDER BY id LIMIT 1) ==="
            plesk db "SELECT id, status FROM tp_crm.erp_loan_contracts WHERE status='active' ORDER BY id LIMIT 1" 2>&1
            echo "=== renovation projects linked to that contract + their spent ==="
            plesk db "SELECT r.id, r.contract_id, r.project_id, r.property_id,
                        (SELECT COALESCE(SUM(e.amount),0) FROM tp_crm.erp_renovation_expenses e WHERE e.renovation_project_id=r.id) AS spent
                      FROM tp_crm.erp_renovation_projects r
                      WHERE r.contract_id = (SELECT id FROM tp_crm.erp_loan_contracts WHERE status='active' ORDER BY id LIMIT 1)" 2>&1
            echo "=== total renovation spent via that contract (should equal the +6400) ==="
            plesk db "SELECT COALESCE(SUM(e.amount),0) AS reno_via_contract
                      FROM tp_crm.erp_renovation_expenses e
                      JOIN tp_crm.erp_renovation_projects r ON r.id = e.renovation_project_id
                      WHERE r.contract_id = (SELECT id FROM tp_crm.erp_loan_contracts WHERE status='active' ORDER BY id LIMIT 1)" 2>&1
            echo "=== recent renovation_expenses (2026-06-18) ~ loan testing ==="
            plesk db "SELECT id, renovation_project_id, amount, drawdown_id, created_at FROM tp_crm.erp_renovation_expenses WHERE created_at >= '2026-06-17' ORDER BY id DESC LIMIT 10" 2>&1
