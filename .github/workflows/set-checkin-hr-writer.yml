name: Set tp-checkin HR single-writer flag

# Manual. Sets TP_CHECKIN_USE_HR_ATTENDANCE_API in checkin's prod .env. value=1 routes
# check-in/out writes through tp-hr /api/v1/attendance (single writer); value=0 reverts to
# direct SQL (instant rollback). When enabling, refuses unless the deployed code has the
# single-writer functions AND a full TP_HR_API_KEY is present (otherwise the flag would
# 503 every check-in). Lives in tp-finance (public → Actions run; checkin Actions are
# billing-blocked).
on:
  workflow_dispatch:
    inputs:
      value:
        description: '1 = write via tp-hr API (single writer), 0 = direct SQL (rollback)'
        required: true
        default: '1'

jobs:
  setflag:
    name: Set writer flag
    runs-on: ubuntu-latest
    steps:
      - name: Check SSH config
        id: cfg
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
        run: '[ -n "$SSH_HOST" ] && echo "ready=yes" >> "$GITHUB_OUTPUT" || echo "ready=no" >> "$GITHUB_OUTPUT"'
      - name: Set flag on server
        if: steps.cfg.outputs.ready == 'yes'
        uses: appleboy/ssh-action@v1.0.3
        env:
          VALUE: ${{ inputs.value }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          envs: VALUE
          script: |
            set -e
            case "$VALUE" in 0|1) ;; *) echo "value must be 0 or 1"; exit 2;; esac
            FIN="${{ secrets.SSH_PATH }}"
            CHECKIN=""
            for cand in \
              "$(printf '%s' "$FIN" | sed 's#finance#checkin#g')" \
              "$FIN/../tp-checkin" "$FIN/../checkin"; do
              if [ -n "$cand" ] && [ -f "$cand/api/attendance.php" ]; then CHECKIN=$(realpath "$cand"); break; fi
            done
            [ -n "$CHECKIN" ] || { echo "checkin not found"; exit 1; }
            cd "$CHECKIN"
            touch .env

            if [ "$VALUE" = "1" ]; then
              for fn in checkinHrAttendanceWriterEnabled checkinSubmitCheckInThroughHrApi checkinSubmitCheckOutThroughHrApi; do
                grep -q "function $fn" api/attendance.php || { echo "REFUSE: deployed code missing $fn — flag would 503 check-ins"; exit 1; }
              done
              grep -qE '^TP_HR_API_KEY=tphr_[a-f0-9]{32}$' .env || { echo "REFUSE: no full TP_HR_API_KEY in .env — flag would 503 check-ins"; exit 1; }
            fi

            cp .env ".env.bak.$(date -u +%Y%m%dT%H%M%SZ 2>/dev/null || echo bak)" 2>/dev/null || true
            sed -i '/^TP_CHECKIN_USE_HR_ATTENDANCE_API=/d' .env
            echo "TP_CHECKIN_USE_HR_ATTENDANCE_API=$VALUE" >> .env
            echo "Set in $CHECKIN/.env:"
            grep -E '^TP_CHECKIN_USE_HR_ATTENDANCE_API=' .env
            [ "$VALUE" = "1" ] && echo "Single-writer ENABLED — check-in/out now write via tp-hr API." || echo "Single-writer DISABLED — check-in/out revert to direct SQL."
