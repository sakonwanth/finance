name: Run staging harness check

# Manual, read-only. Runs tp-crm scripts/staging_harness_check.php on the server twice:
# once with no override (should resolve prod tp_crm) and once with DB_NAME=tp_crm_staging
# (should resolve staging). Proves the env override routes CLI work to staging safely.
on:
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Check SSH config
        id: cfg
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
        run: '[ -n "$SSH_HOST" ] && echo "ready=yes" >> "$GITHUB_OUTPUT" || echo "ready=no" >> "$GITHUB_OUTPUT"'
      - name: Run on server
        if: steps.cfg.outputs.ready == 'yes'
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          script: |
            set -e
            CRM="/var/www/vhosts/tp-asset.com/crm.tp-asset.com"
            [ -d "$CRM" ] || { echo "crm not found"; exit 1; }
            cd "$CRM"
            git fetch origin main --quiet 2>&1 || echo "fetch warn"
            git show origin/main:scripts/staging_harness_check.php > scripts/staging_harness_check.php
            PHP_BIN=$(which php 2>/dev/null || echo php)
            echo "===== default (no override) — expect prod tp_crm ====="
            $PHP_BIN scripts/staging_harness_check.php 2>&1 | head -10
            echo "===== DB_NAME=tp_crm_staging override — expect staging ====="
            DB_NAME=tp_crm_staging $PHP_BIN scripts/staging_harness_check.php 2>&1 | head -10
