name: Payroll e2e on staging

# Manual. Runs tp-crm's payroll mark-paid ledger e2e against tp_crm_staging (NOT prod).
# The script self-seeds an approved payroll_run, marks it paid, verifies the ledger row,
# cancels + cleans up its own test rows. Safe on staging. Proves the off-prod payroll
# verification path works — the gate Phase 2.1's write-migration was blocked on.
on:
  workflow_dispatch:

jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - name: Check SSH config
        id: cfg
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
        run: '[ -n "$SSH_HOST" ] && echo "ready=yes" >> "$GITHUB_OUTPUT" || echo "ready=no" >> "$GITHUB_OUTPUT"'
      - name: Run on server (staging DB)
        if: steps.cfg.outputs.ready == 'yes'
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          command_timeout: 15m
          script: |
            set -e
            CRM="/var/www/vhosts/tp-asset.com/crm.tp-asset.com"
            cd "$CRM"
            # Hard safety: staging schema + force direct DB (no prod HR/ERP API calls).
            export DB_NAME=tp_crm_staging
            export TP_CRM_DB_NAME=tp_crm_staging
            export USE_TPERP_API=0
            export USE_TPHR_PAYROLL=0
            PHP_BIN=$(which php 2>/dev/null || echo php)
            echo "Target schema check:"
            SCHEMA=$($PHP_BIN scripts/staging_harness_check.php 2>&1 | sed -n 's/^current schema = //p' | head -1)
            echo "  resolved schema = $SCHEMA"
            [ "$SCHEMA" = "tp_crm_staging" ] || { echo "ABORT: resolved schema is '$SCHEMA', not tp_crm_staging"; exit 1; }
            echo "===== payroll mark-paid e2e (staging) ====="
            $PHP_BIN scripts/e2e_payroll_mark_paid_ledger_live.php --live 2>&1 | tail -40
            echo "===== prod leak guard (must stay 0) ====="
            plesk db "SELECT COUNT(*) AS prod_recent_payroll_tx FROM tp_crm.erp_company_transactions WHERE reference_type='payroll' AND created_at >= NOW() - INTERVAL 30 MINUTE" 2>&1
