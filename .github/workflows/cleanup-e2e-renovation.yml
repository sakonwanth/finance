name: Clean E2E leftover renovation on contract 1

# Manual. Deletes the E2E test renovation expenses left on renovation_project #25 / loan
# contract #1 (contractor_supplier='E2E CRM Vendor', notes mention 'E2E CRM BOQ expense').
# These leak into the P&L of every customer sharing contract #1 (3 seed fixtures + pilot).
# Guarded multi-condition WHERE so ONLY the E2E test rows can match. Verifies 0 after.
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "clean" to confirm'
        required: true
        default: ''

jobs:
  clean:
    runs-on: ubuntu-latest
    steps:
      - name: Gate
        id: cfg
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
        run: |
          [ "${{ inputs.confirm }}" = "clean" ] || { echo "confirm != clean"; exit 1; }
          [ -n "$SSH_HOST" ] && echo "ready=yes" >> "$GITHUB_OUTPUT" || exit 1
      - name: Clean on server
        if: steps.cfg.outputs.ready == 'yes'
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          script: |
            echo "=== before: E2E renovation rows on project #25 (contract #1) ==="
            plesk db "SELECT id, amount, contractor_supplier, LEFT(notes,40) note FROM tp_crm.erp_renovation_expenses WHERE renovation_project_id=25 AND contractor_supplier='E2E CRM Vendor' AND notes LIKE '%E2E CRM BOQ expense%'" 2>&1
            echo "=== delete (guarded: project 25 + E2E vendor + E2E note + drawdown NULL) ==="
            plesk db "DELETE FROM tp_crm.erp_renovation_expenses
                      WHERE renovation_project_id=25
                        AND contractor_supplier='E2E CRM Vendor'
                        AND notes LIKE '%E2E CRM BOQ expense%'
                        AND drawdown_id IS NULL
                        AND company_transaction_id IS NULL" 2>&1
            echo "=== after: renovation spend via contract #1 (expect 0) ==="
            plesk db "SELECT COALESCE(SUM(e.amount),0) AS reno_via_contract1
                      FROM tp_crm.erp_renovation_expenses e
                      JOIN tp_crm.erp_renovation_projects r ON r.id=e.renovation_project_id
                      WHERE r.contract_id=1" 2>&1
            echo "=== leave the now-empty renovation_project #25 (spent=0, harmless) ==="
