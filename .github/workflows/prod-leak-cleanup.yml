name: Clean prod payroll leak row

# Manual. Removes the SINGLE orphaned payroll test-artifact row the staging e2e wrote into
# PROD erp_company_transactions via API mode (id 1296: code PAY-20991201-*, amount 9500,
# reference_id 142, future-dated 2099, no matching prod payroll_run). Multi-condition WHERE
# so only that exact artifact can match. Verifies 0 remaining after.
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "delete-1296" to confirm'
        required: true
        default: ''

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Check inputs + SSH
        id: cfg
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
        run: |
          [ "${{ inputs.confirm }}" = "delete-1296" ] || { echo "confirm mismatch — abort"; exit 1; }
          [ -n "$SSH_HOST" ] && echo "ready=yes" >> "$GITHUB_OUTPUT" || exit 1
      - name: Cleanup on server
        if: steps.cfg.outputs.ready == 'yes'
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          script: |
            echo "=== before ==="
            plesk db "SELECT id, transaction_code, amount, reference_id, created_at FROM tp_crm.erp_company_transactions WHERE id=1296 AND reference_type='payroll' AND reference_id=142 AND transaction_code LIKE 'PAY-20991201-%' AND amount=9500.00" 2>&1
            echo "=== delete (guarded: id + reference + 2099 code + amount, and only if no real payroll_run #142 exists) ==="
            plesk db "DELETE FROM tp_crm.erp_company_transactions WHERE id=1296 AND reference_type='payroll' AND reference_id=142 AND transaction_code LIKE 'PAY-20991201-%' AND amount=9500.00 AND NOT EXISTS (SELECT 1 FROM tp_crm.payroll_runs pr WHERE pr.id=142)" 2>&1
            echo "=== after (expect 0) ==="
            plesk db "SELECT COUNT(*) AS remaining FROM tp_crm.erp_company_transactions WHERE id=1296" 2>&1
            plesk db "SELECT COUNT(*) AS recent_payroll_tx FROM tp_crm.erp_company_transactions WHERE reference_type='payroll' AND created_at >= NOW() - INTERVAL 2 HOUR" 2>&1
